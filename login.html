<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in · B. B. Academy</title><link rel="stylesheet" href="style.css"></head>
<body data-page="login"><header id="hdr"></header>
<main><form id="f" class="card narrow" autocomplete="off"><h2>Log in</h2><p class="mut">Students, teachers and admins log in here.</p>
<label>Username</label><input id="un" required>
<label>Password</label><div class="pw"><input id="pw" type="password" required><button type="button" class="eye" aria-label="Show or hide password"></button></div>
<div id="cw" class="hide"><label>Teacher access code</label><div class="pw"><input id="cd" type="password" placeholder="Issued by the admin"><button type="button" class="eye" aria-label="Show or hide access code"></button></div></div>
<br><button>Log in</button><div class="msg" id="m"></div><p class="mut">No account? <a href="signup.html">Sign up</a></p></form></main>
<script src="script.js"></script></body></html>
